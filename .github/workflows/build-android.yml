name: Build Android APK

# Builds the UI-redesigned JieqiBox for Android (arm64-v8a only, which covers
# every reasonably modern phone and keeps the CI runtime sane).
#
# The APK is attached to the fixed release tag "ui-latest", so the download URL
# never changes:
#   https://github.com/<owner>/<repo>/releases/download/ui-latest/jieqibox-ui-arm64.apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'src/styles/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still asks for `tools`, which no
          # longer exists in recent cmdline-tools, so `sdkmanager tools` fails
          # and takes the whole step down. Name what we actually need instead.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'
          accept-android-sdk-licenses: true

      - name: Export NDK environment variables
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_PATH="$SDK/ndk/26.1.10909125"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          fi
          test -d "$NDK_PATH"
          echo "Using NDK at $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH"          >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install JS dependencies
        run: npm ci

      - name: Type check and build frontend
        run: npm run build

      - name: Build Tauri Android app (unsigned)
        run: npx tauri android build --apk --target aarch64
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
            echo "Using keystore from repository secret"
          else
            base64 -d .github/signing/release.jks.b64 > "$RUNNER_TEMP/sign/release.jks"
            echo "Using bundled self-signed keystore"
          fi

      - name: Align and sign APK
        id: sign
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::No APK produced"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/sign/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/sign/release.jks" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias hotrank \
            --out "$RUNNER_TEMP/sign/jieqibox-ui-arm64.apk" \
            "$RUNNER_TEMP/sign/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/sign/jieqibox-ui-arm64.apk"
          ls -lh "$RUNNER_TEMP/sign/jieqibox-ui-arm64.apk"
          echo "apk=$RUNNER_TEMP/sign/jieqibox-ui-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jieqibox-ui-arm64
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to the fixed release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ui-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          cp "${{ steps.sign.outputs.apk }}" jieqibox-ui-arm64.apk
          gh release create "$TAG" jieqibox-ui-arm64.apk \
            --title "JieqiBox 界面重做版" \
            --notes "基于官方原版 0.7.2 的界面重做（arm64-v8a，包名 com.jieqibox.app）。与官方版本包名相同、签名相同，可直接覆盖安装。" \
            --prerelease
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$TAG/jieqibox-ui-arm64.apk"
