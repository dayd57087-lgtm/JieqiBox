name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run build

      - name: Install Clippy
        run: rustup component add clippy

      - name: Check Rust
        run: |
          cd src-tauri
          cargo check
          set +e
          cargo clippy -- -D warnings 2>&1 | tee /tmp/clippy.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # TEMPORARY DIAGNOSTIC: surface the lints as annotations, because
            # job logs are not readable without write access to this repo.
            grep -E "^error(\[|:)" /tmp/clippy.txt | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -B2 -A6 "^error(\[|:)" /tmp/clippy.txt | head -60 | while IFS= read -r line; do
              echo "::warning::$line"
            done
          fi
          exit "$status"

      - name: Run tests (if available)
        run: npm test || echo "No tests configured yet"

      - name: Check formatting
        run: |
          npm run lint || echo "No linting configured yet"
          npx prettier --check . || echo "No prettier configured yet"
